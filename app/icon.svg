<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rings drawn as even-odd filled annuli rather than stroked circles: it
       renders identically in browsers but survives rasterisers whose SVG
       support stops short of strokes. -->
  <rect width="32" height="32" fill="#0a0a0a"/>
  <path fill="#fafafa" fill-rule="evenodd" d="M 1.2,16 a 10,10 0 1,0 20,0 a 10,10 0 1,0 -20,0 Z M 3.8,16 a 7.4,7.4 0 1,0 14.8,0 a 7.4,7.4 0 1,0 -14.8,0 Z"/>
  <path fill="#fafafa" fill-rule="evenodd" d="M 16.4,16 a 7,7 0 1,0 14,0 a 7,7 0 1,0 -14,0 Z M 19,16 a 4.4,4.4 0 1,0 8.8,0 a 4.4,4.4 0 1,0 -8.8,0 Z"/>
</svg>
